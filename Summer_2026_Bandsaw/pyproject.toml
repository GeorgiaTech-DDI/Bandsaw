[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bandsaw-safety-monitor"
version = "0.1.0"
description = "Modular computer-vision safety monitoring for bandsaws"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.19.0",
    "opencv-python>=4.5.0",
]

[project.optional-dependencies]
vision = ["mediapipe>=0.8.0"]
raspberry-pi = ["smbus2>=0.4.0", "pi5neo"]
test = ["robotframework>=6.1"]

[project.scripts]
bandsaw-monitor = "bandsaw.monitor:main"

[tool.setuptools.packages.find]
include = ["bandsaw*"]